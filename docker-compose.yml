services:
  backend:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SHARE_TOKEN_SECRET: ${SHARE_TOKEN_SECRET}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      AI_SERVICE_URL: http://ai-service:8000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_ASSISTANT_ENABLED: ${AI_ASSISTANT_ENABLED:-true}
      NODE_ENV: production
      PORT: 3000
      WAHA_URL: ${WAHA_URL:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_ADMIN_CHAT_ID: ${WAHA_ADMIN_CHAT_ID:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      WAHA_WEBHOOK_SECRET: ${WAHA_WEBHOOK_SECRET:-}
      BASE_URL: ${BASE_URL:-https://erp.gpacksa.com}
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - /var/data/gpack-uploads:/app/uploads
    networks:
      default:
        aliases:
          - gpack-api
      dokploy-network:

  notification-worker:
    build: ./backend
    restart: unless-stopped
    stop_grace_period: 10s
    command: ["node", "services/notification-worker.js"]
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      WAHA_URL: ${WAHA_URL:-}
      WAHA_SESSION: ${WAHA_SESSION:-default}
      WAHA_ADMIN_CHAT_ID: ${WAHA_ADMIN_CHAT_ID:-}
      WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-waha}
      WAHA_API_KEY: ${WAHA_API_KEY:-}
      BASE_URL: ${BASE_URL:-https://erp.gpacksa.com}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - /var/data/gpack-uploads:/app/uploads
    networks:
      - default
      - dokploy-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        CACHEBUST: ${CACHEBUST:-1}
    restart: unless-stopped
    stop_grace_period: 10s
    expose:
      - "80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - default
      - dokploy-network

  mcp-server:
    build: ./mcp-server
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      MCP_PORT: 3001
    expose:
      - "3001"
    networks:
      - default
      - dokploy-network

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      DB_HOST: ${DATABASE_HOST}
      DB_PORT: 5432
      DB_NAME: ${DATABASE_NAME}
      DB_USER: ${DATABASE_USER}
      DB_PASSWORD: ${DATABASE_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      VOICE_PROVIDER: ${VOICE_PROVIDER:-whisper}
      VOICE_WHISPER_MODEL: ${VOICE_WHISPER_MODEL:-whisper-1}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - default
      - dokploy-network

networks:
  dokploy-network:
    external: true
    name: dokploy-network
