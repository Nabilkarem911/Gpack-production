<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>أمر تشغيل | G.PACK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { font-family: 'Cairo', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
        }
        .design-img { max-width: 100%; height: auto; border-radius: 12px; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen">

<!-- Loading -->
<div id="loading" class="fixed inset-0 bg-white flex flex-col items-center justify-center z-50">
    <div class="w-14 h-14 border-4 border-purple-600 border-t-transparent rounded-full animate-spin mb-4"></div>
    <p class="text-slate-500 text-sm">جاري تحميل أمر التشغيل...</p>
</div>

<!-- Error State -->
<div id="error-state" class="hidden fixed inset-0 bg-slate-100 flex flex-col items-center justify-center p-6">
    <div class="bg-white rounded-2xl shadow-lg p-10 max-w-md w-full text-center">
        <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
            <i class="fa-solid fa-link-slash text-2xl text-red-500"></i>
        </div>
        <h2 class="text-xl font-bold text-slate-800 mb-2">الرابط غير صالح</h2>
        <p id="error-msg" class="text-slate-500 text-sm">انتهت صلاحية هذا الرابط أو أنه غير موجود.</p>
    </div>
</div>

<!-- Main Content -->
<div id="main-content" class="hidden max-w-4xl mx-auto py-8 px-4">

    <!-- Header -->
    <div class="bg-gradient-to-l from-purple-700 to-purple-900 rounded-2xl p-6 text-white mb-6 shadow-lg">
        <div class="flex items-center justify-between flex-wrap gap-4">
            <div class="flex items-center gap-4">
                <img src="/images/logo.png" alt="G.PACK" class="h-14 w-auto bg-white rounded-xl p-1" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" />
                <div style="display:none;width:56px;height:56px;background:#fbbf24;border-radius:12px;align-items:center;justify-content:center;">
                    <i class="fa-solid fa-industry text-2xl text-purple-900"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold">G.PACK</h1>
                    <p class="text-purple-200 text-sm">أمر تشغيل مورد</p>
                </div>
            </div>
            <div class="text-left">
                <p class="text-purple-200 text-xs">رقم الأمر</p>
                <p id="mo-number" class="text-2xl font-extrabold text-amber-400">#—</p>
            </div>
        </div>
    </div>

    <!-- Info Cards -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-xl p-4 border border-slate-200">
            <p class="text-xs text-slate-400 mb-1">المورد</p>
            <p id="mo-supplier" class="font-bold text-slate-800 text-sm">—</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-200">
            <p class="text-xs text-slate-400 mb-1">العميل</p>
            <p id="mo-client" class="font-bold text-slate-800 text-sm">—</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-200">
            <p class="text-xs text-slate-400 mb-1">تاريخ الأمر</p>
            <p id="mo-date" class="font-bold text-slate-800 text-sm">—</p>
        </div>
        <div class="bg-white rounded-xl p-4 border border-slate-200">
            <p class="text-xs text-slate-400 mb-1">التسليم المتوقع</p>
            <p id="mo-delivery" class="font-bold text-slate-800 text-sm">—</p>
        </div>
    </div>

    <!-- Items Table -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden mb-6">
        <div class="px-5 py-4 border-b border-slate-100">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-list text-purple-600"></i>
                بنود الطلب
            </h2>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead>
                    <tr class="bg-slate-50 text-xs text-slate-500">
                        <th class="py-3 px-4 text-right font-bold">الصنف</th>
                        <th class="py-3 px-4 text-center font-bold">المقاس</th>
                        <th class="py-3 px-4 text-center font-bold">الكمية</th>
                        <th class="py-3 px-4 text-center font-bold">الحالة</th>
                    </tr>
                </thead>
                <tbody id="mo-items"></tbody>
            </table>
        </div>
    </div>

    <!-- Notes -->
    <div id="mo-notes-section" class="hidden bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6">
        <p class="text-xs font-bold text-amber-700 mb-1"><i class="fa-solid fa-clipboard ml-1"></i>ملاحظات</p>
        <p id="mo-notes" class="text-sm text-amber-800"></p>
    </div>

    <!-- Design Files Section -->
    <div id="mo-designs-section" class="mb-6">
        <div class="px-5 py-4 bg-white rounded-2xl shadow-sm border border-slate-200 mb-4">
            <h2 class="font-bold text-slate-800 flex items-center gap-2">
                <i class="fa-solid fa-palette text-purple-600"></i>
                التصاميم والملفات
            </h2>
        </div>
        <div id="mo-designs" class="space-y-6"></div>
    </div>

    <!-- Print Button -->
    <div class="no-print text-center mt-8">
        <button onclick="window.print()" class="px-8 py-3 bg-purple-700 text-white rounded-xl font-bold hover:bg-purple-800 transition-colors shadow-lg">
            <i class="fa-solid fa-print ml-2"></i> طباعة
        </button>
    </div>

    <div class="text-center mt-6 text-xs text-slate-400">
        <p>G.PACK ERP 2.0 — تم إنشاء هذا الرابط للمورد</p>
    </div>
</div>

<script>
const IMAGE_EXTS = new Set(['png','jpg','jpeg','svg','gif','webp','bmp','tif','tiff']);
const PDF_EXTS = new Set(['pdf']);

function getExt(url) {
    if (!url) return '';
    const clean = url.split('?')[0].split('#')[0];
    const idx = clean.lastIndexOf('.');
    return idx === -1 ? '' : clean.substring(idx + 1).toLowerCase();
}

function normalizeUrl(url) {
    if (!url) return '';
    if (url.startsWith('http') || url.startsWith('/') || url.startsWith('data:')) return url;
    return '/' + url;
}

function fmtDate(d) {
    if (!d) return '—';
    return new Date(d).toLocaleDateString('en-GB');
}

function fmtFileSize(bytes) {
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function safeDecodeName(name) {
    if (!name) return '';
    if (typeof name !== 'string') name = String(name);
    if (name.includes('%')) {
        try { return decodeURIComponent(name); } catch (e) { /* ignore */ }
    }
    if ([...name].every(c => c.charCodeAt(0) <= 255)) {
        try { return decodeURIComponent(escape(name)); } catch (e) { /* ignore */ }
    }
    return name;
}

function escapeHtml(str) {
    return String(str ?? '').replace(/&/g, '&amp;')
        .replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function escapeAttr(str) {
    return String(str ?? '').replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;');
}

let moData = null;

(async () => {
    const token = new URLSearchParams(window.location.search).get('token');
    if (!token) return showError('الرابط غير صالح — لا يوجد token.');

    try {
        const res = await fetch(`/api/public/manufacturer-order/${token}`);
        const data = await res.json();
        if (!res.ok) return showError(data.error || 'حدث خطأ.');
        moData = data.data;
        renderMO(moData);
    } catch (e) {
        showError('تعذّر الاتصال بالخادم.');
    }
})();

function showError(msg) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('error-msg').textContent = msg;
    document.getElementById('error-state').classList.remove('hidden');
}

function renderMO({ order, items }) {
    document.getElementById('loading').classList.add('hidden');
    document.getElementById('main-content').classList.remove('hidden');

    document.getElementById('mo-number').textContent = '#' + (order.mo_number || '—');
    document.getElementById('mo-supplier').textContent = order.supplier_name || '—';
    document.getElementById('mo-client').textContent = order.client_name || '—';
    document.getElementById('mo-date').textContent = fmtDate(order.order_date || order.created_at);
    document.getElementById('mo-delivery').textContent = fmtDate(order.expected_delivery_date);

    if (order.notes) {
        document.getElementById('mo-notes').textContent = order.notes;
        document.getElementById('mo-notes-section').classList.remove('hidden');
    }

    // Items table
    const tbody = document.getElementById('mo-items');
    tbody.innerHTML = items.map(i => {
        const isReprint = i.design_status === 'redesign' || i.design_status === 'reprint';
        const statusLabel = isReprint ? 'إعادة طباعة' : 'تصميم جديد';
        const statusColor = isReprint ? 'text-amber-700 bg-amber-100' : 'text-emerald-700 bg-emerald-100';
        const qty = parseInt(i.mo_quantity || 0);
        return `<tr class="border-b border-slate-50">
            <td class="py-3 px-4">
                <p class="font-semibold text-slate-800 text-sm">${i.product_name || '—'}</p>
                ${i.design_name ? `<p class="text-xs text-slate-400">${i.design_name}</p>` : ''}
                ${i.pantone_color ? `<p class="text-xs font-bold text-purple-600">🎨 ${i.pantone_color}</p>` : ''}
            </td>
            <td class="py-3 px-4 text-center text-slate-600 text-sm">${i.size_name || '—'}</td>
            <td class="py-3 px-4 text-center font-bold text-slate-800">${qty.toLocaleString('en-US')}</td>
            <td class="py-3 px-4 text-center">
                <span class="inline-block px-3 py-1 rounded-full text-xs font-bold ${statusColor}">${statusLabel}</span>
            </td>
        </tr>`;
    }).join('');

    // Design files
    const designsContainer = document.getElementById('mo-designs');
    const designsHtml = items.map((item, idx) => {
        const files = (Array.isArray(item.design_files) ? item.design_files : [])
            .filter(f => f.file_type !== 'thumbnail' && !/thumbnail/i.test(f.name || ''));
        const hasThumb = !!item.design_thumbnail;
        if (files.length === 0 && !hasThumb) return '';

        // If no source files but has thumbnail, create synthetic entry
        const allFiles = files.length > 0 ? files : [{
            path: item.design_thumbnail,
            name: item.design_name || 'تصميم',
            size: null,
            uploaded_at: null
        }];

        const fileSections = allFiles.map((f, fIdx) => {
            const normUrl = normalizeUrl(f.path);
            const absUrl = normUrl.startsWith('http') ? normUrl : window.location.origin + normUrl;
            const ext = getExt(f.path || f.name || '');
            const isImage = IMAGE_EXTS.has(ext);
            const isPdf = PDF_EXTS.has(ext);

            // Preview image priority: real image > server-generated PDF preview > thumbnail if image
            const genPreview = f.preview_image || item.design_thumbnail_image || '';
            const genPreviewUrl = genPreview ? normalizeUrl(genPreview) : '';
            const genPreviewAbs = genPreviewUrl ? (genPreviewUrl.startsWith('http') ? genPreviewUrl : window.location.origin + genPreviewUrl) : '';

            const thumbUrl = item.design_thumbnail ? normalizeUrl(item.design_thumbnail) : '';
            const thumbAbs = thumbUrl ? (thumbUrl.startsWith('http') ? thumbUrl : window.location.origin + thumbUrl) : '';
            const thumbIsImage = thumbAbs && IMAGE_EXTS.has(getExt(thumbAbs));

            const staticImg = isImage ? absUrl : (genPreviewAbs || (thumbIsImage ? thumbAbs : ''));

            const fileName = escapeHtml(safeDecodeName(f.name || item.design_name || `تصميم-${idx + 1}-${fIdx + 1}`));
            const fileNameAttr = escapeAttr(safeDecodeName(f.name || item.design_name || `تصميم-${idx + 1}-${fIdx + 1}`));

            let previewHtml = '';
            if (staticImg) {
                previewHtml = `<img src="${encodeURI(staticImg)}" alt="${fileNameAttr}" class="design-img" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" loading="lazy">
                <div style="display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px;background:#f8fafc;border-radius:12px;">
                    <div style="width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:${isPdf ? '#dc2626' : '#475569'};background:${isPdf ? '#fee2e2' : '#f1f5f9'};">${(ext || 'FILE').toUpperCase()}</div>
                    <p style="font-size:12px;color:#94a3b8;margin-top:10px;">${fileName}</p>
                </div>`;
            } else {
                previewHtml = `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px;background:#f8fafc;border-radius:12px;">
                    <div style="width:64px;height:64px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;color:${isPdf ? '#dc2626' : '#475569'};background:${isPdf ? '#fee2e2' : '#f1f5f9'};">${(ext || 'FILE').toUpperCase()}</div>
                    <p style="font-size:12px;color:#94a3b8;margin-top:10px;">${fileName}</p>
                </div>`;
            }
            const fileSize = fmtFileSize(f.size);

            return `<div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
                <div class="flex flex-col md:flex-row gap-5">
                    <div class="flex-1 min-w-0">
                        <div class="rounded-xl overflow-hidden border border-slate-200 bg-slate-50">
                            ${previewHtml}
                        </div>
                    </div>
                    <div class="md:w-56 flex-shrink-0 bg-slate-50 rounded-xl p-4 border border-slate-100">
                        <p class="text-xs font-bold text-purple-700 mb-3">معلومات الملف</p>
                        <div class="space-y-2 text-xs">
                            <div>
                                <span class="text-slate-400 block mb-1">اسم الملف</span>
                                <span class="font-bold text-slate-700 break-words" dir="auto">${fileName}</span>
                            </div>
                            <div>
                                <span class="text-slate-400 block mb-1">الحجم</span>
                                <span class="font-bold text-slate-700">${fileSize}</span>
                            </div>
                        </div>
                        <div class="mt-4 space-y-2">
                            <a href="${encodeURI(absUrl)}" target="_blank" class="block w-full text-center py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-xs font-bold transition-colors">
                                <i class="fa-solid fa-up-right-from-square ml-1"></i> فتح في تبويب
                            </a>
                            <a href="${encodeURI(absUrl)}" download="${fileNameAttr}" class="block w-full text-center py-2 bg-purple-700 hover:bg-purple-800 text-white rounded-lg text-xs font-bold transition-colors">
                                <i class="fa-solid fa-download ml-1"></i> تحميل الملف
                            </a>
                        </div>
                    </div>
                </div>
            </div>`;
        }).join('');

        if (!fileSections) return '';

        return `<div>
            <div class="flex items-center gap-3 mb-3">
                <div class="w-10 h-10 bg-purple-700 text-amber-400 rounded-xl flex items-center justify-center font-extrabold text-sm">${idx + 1}</div>
                <div>
                    <h3 class="font-bold text-slate-800 text-sm">${item.product_name || ''} ${item.size_name || ''}</h3>
                    ${item.design_name ? `<p class="text-xs text-slate-400">${item.design_name}</p>` : ''}
                </div>
            </div>
            ${fileSections}
        </div>`;
    }).join('');

    if (!designsHtml.trim()) {
        document.getElementById('mo-designs-section').classList.add('hidden');
    } else {
        designsContainer.innerHTML = designsHtml;
    }
}
</script>
</body>
</html>
